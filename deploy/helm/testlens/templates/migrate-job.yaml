{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels:
    {{- include "testlens.labels" . | nindent 4 }}
    app.kubernetes.io/name: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "testlens.labels" . | nindent 8 }}
        app.kubernetes.io/name: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
      containers:
        - name: migrate
          image: {{ include "testlens.image" (list . .Values.api.repository) }}
          command: ["alembic", "upgrade", "head"]
          env:
            {{- include "testlens.apiEnv" . | nindent 12 }}
{{- end }}

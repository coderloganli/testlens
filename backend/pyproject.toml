[project]
name = "testlens-backend"
version = "0.1.0"
description = "TestLens API: an LLM agent over drive-fleet reliability test data."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.31",
    "alembic>=1.20",
    "redis>=8.1",
    "pydantic-settings>=2.15",
    "anthropic>=1.11",
    "structlog>=26.1",
    "prometheus-client>=0.26",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b0",
    "opentelemetry-instrumentation-redis>=0.66b0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.22",
    "fakeredis>=2.39",
    "httpx>=0.28",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: testlens
      POSTGRES_PASSWORD: testlens
      POSTGRES_DB: testlens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testlens"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  migrate:
    build: ./backend
    command: sh -c "alembic upgrade head && python -m app.seed"
    environment: &api-env
      DATABASE_URL: postgresql+asyncpg://testlens:testlens@postgres:5432/testlens
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LOG_JSON: "true"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    environment: *api-env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
